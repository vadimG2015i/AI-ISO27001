[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iso-assistant"
version = "0.1.0"
description = "AI ISO 27001:2022 Compliance Assistant"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ISO 27001 AI Team" }
]
dependencies = [
    "streamlit>=1.39.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "pdfplumber>=0.11.0",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "pandas>=2.2.0",
    "plotly>=5.22.0",
    "xlsxwriter>=3.2.0",
    "reportlab>=4.2.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

